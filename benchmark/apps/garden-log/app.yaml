id: garden-log
product: Garden Log
stack: nuxt-fastapi
stratum: nuxt-fastapi
split: dev
ports: {web: 3701, api: 8701}
start: [npm run dev]
readyPath: /login
warmPaths: [/login, /, /plants, /plants/new, /harvests/new, /tasks, /beds]
reset: npm run reset
check: [npm run check]
env: {DEMO_EMAIL: demo@example.com, DEMO_PASSWORD: demo-password}
harvest: {model: claude-opus-5-5 (subagent), claudeCode: 2.1.311, date: 2026-10-27}
builtBy: maintainer
basedOn: null
status: active
# Whole words the hint lint allows in this app's base and patches: a garden app
# says "Planted on".
allowWords: [planted]
