name: first-publish

# One-off: publishes 0.1.0 with the NPM_TOKEN secret, because npm trusted
# publishing can only be set up for a package that already exists. Publishes the
# exact tarball a release run packed and tested. Delete this workflow and the
# NPM_TOKEN secret once trusted publishing is on.
on:
  workflow_dispatch:
    inputs:
      release-run:
        description: Release run whose tarball to publish
        required: true
        default: '41227813356'

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: tarball
          run-id: ${{ inputs.release-run }}
          github-token: ${{ github.token }}
      - name: Check the tarball's sha512, then publish it
        working-directory: tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          sha512sum --check tarball.sha512
          npm publish ./rough-ride-*.tgz --access public
