name: release

# Packs the tarball once on Linux, installs that exact tarball on three OSes,
# and publishes it only when trusted publishing is on (spec part 1 section 3).
# 0.1.0 is published by hand: `publish` skips while TRUSTED_PUBLISHING is unset.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
      - run: npm ci
      - run: npm ci --prefix packages/rough-ride
      - run: npm run build
      - run: npm test
      - run: node scripts/versions.mjs sync --tag "$GITHUB_REF_NAME"
      - run: node scripts/pack-contents.mjs
      - name: npm pack
        working-directory: packages/rough-ride
        run: |
          npm pack --ignore-scripts
          sha512sum rough-ride-*.tgz | tee tarball.sha512
          mkdir files && tar -xzf rough-ride-*.tgz -C files
          (cd files && find . -type f -print0 | sort -z | xargs -0 sha256sum) > files.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: |
            packages/rough-ride/rough-ride-*.tgz
            packages/rough-ride/tarball.sha512
            packages/rough-ride/files.sha256

  test-tarball:
    name: test-tarball (${{ matrix.os }})
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: tarball
      - run: npm ci
      - name: Claude Code, pinned (floor and newest tested)
        run: npm install --global @anthropic-ai/claude-code@2.1.299
      - name: Steps 1 to 5 (the single Linux-packed tarball)
        shell: bash
        run: node scripts/test-tarball.mjs tarball/rough-ride-*.tgz --step5
      - name: Validate again at the newest tested Claude Code
        shell: bash
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.311
          mkdir unpacked && tar -xzf tarball/rough-ride-*.tgz -C unpacked
          (cd unpacked/package && npm ci --omit=dev --ignore-scripts)
          claude plugin validate --strict unpacked/package
      - name: Version check through pwsh and cmd (Windows shims)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shim | Out-Null
          Set-Location shim
          '{"name":"shim","private":true}' | Out-File -Encoding ascii package.json
          $tgz = (Get-ChildItem ..\tarball\rough-ride-*.tgz).FullName
          npm install --no-audit --no-fund --ignore-scripts $tgz
          npx --no -- rough-ride --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmd /c "npx --no -- rough-ride --version"
          if ($LASTEXITCODE -ne 0) { exit 1 }

  publish:
    needs: [pack, test-tarball]
    if: vars.TRUSTED_PUBLISHING == 'on' && !contains(github.ref_name, '-rc.')
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: tarball
      - name: Check the tarball's sha512, then publish it
        working-directory: tarball
        run: |
          sha512sum --check tarball.sha512
          if [ "${{ vars.NPM_PUBLISH }}" = "direct" ]; then
            npm publish ./rough-ride-*.tgz
          else
            npm stage publish ./rough-ride-*.tgz
          fi
