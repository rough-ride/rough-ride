<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
<title id="title">rough-ride | Browser-based resilience testing</title>
<desc id="desc">A bright orange browser-shaped off-road car drives over a bumpy road, past a 500 warning and an offline marker. Rough-ride drives your app down a rough road before your users do.</desc>
<defs>
  <clipPath id="canvas"><rect width="1600" height="600" rx="26"/></clipPath>
  <filter id="car-shadow" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#1D2D39" flood-opacity=".12"/>
  </filter>
</defs>
<g clip-path="url(#canvas)">
  <rect width="1600" height="600" fill="#FCFBF7"/>
  <path d="M802 0H1600V600H816C871 505 844 430 806 353C754 253 768 109 802 0Z" fill="#F1F8F6"/>

  <!-- Brand first: legible even when GitHub scales the banner down. -->
  <g font-family="Inter, Inter Display, Arial, sans-serif">
    <text x="92" y="224" fill="#202C3A" font-weight="850" font-size="105" letter-spacing="-6.5">rough<tspan fill="#F36F52">-</tspan>ride</text>
    <rect x="100" y="255" width="49" height="7" rx="3.5" fill="#F36F52"/>
    <text x="99" y="336" fill="#293847" font-size="32" font-weight="700" letter-spacing="-0.6">Drives your app down a rough road,</text>
    <text x="99" y="382" fill="#293847" font-size="32" font-weight="700" letter-spacing="-0.6">before your users do.</text>
    <text x="100" y="449" fill="#677482" font-size="23" font-weight="450">Resilience testing for agent-built web apps.</text>
  </g>

  <!-- Two unmistakable stress conditions. -->
  <g transform="translate(895 300)" font-family="Inter, Arial, sans-serif">
    <path d="M0 70V152" fill="none" stroke="#43586A" stroke-width="7" stroke-linecap="round"/>
    <rect x="-54" y="0" width="108" height="77" rx="18" fill="#FFFEFB" stroke="#304658" stroke-width="5"/>
    <rect x="-44" y="10" width="88" height="57" rx="10" fill="#FFE2D5"/>
    <text x="0" y="50" fill="#A84735" font-size="36" font-weight="820" text-anchor="middle">500</text>
  </g>
  <g transform="translate(1461 262)" font-family="Inter, Arial, sans-serif">
    <rect x="-44" y="-22" width="112" height="52" rx="26" fill="#FFFEFB" stroke="#304658" stroke-width="4"/>
    <circle cx="-20" cy="4" r="10" fill="#E9796C"/>
    <path d="M-24 0l8 8m0-8l-8 8" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
    <text x="-1" y="11" font-size="21" font-weight="730" fill="#344657">offline</text>
  </g>

  <!-- A single road: no landscape, stars, decorative confetti or tiny caption text. -->
  <path d="M849 481C943 441 996 527 1100 487C1207 443 1296 460 1382 485C1477 514 1534 447 1630 443" fill="none" stroke="#D8E4DF" stroke-width="103" stroke-linecap="round"/>
  <path d="M849 473C943 433 996 519 1100 479C1207 435 1296 452 1382 477C1477 506 1534 439 1630 435" fill="none" stroke="#304354" stroke-width="90" stroke-linecap="round"/>
  <path d="M849 473C943 433 996 519 1100 479C1207 435 1296 452 1382 477C1477 506 1534 439 1630 435" fill="none" stroke="#F7DEAC" stroke-width="5" stroke-dasharray="24 28" stroke-linecap="round"/>

  <!-- A friendly browser-car, drawn as one reproducible vector brand asset. -->
  <g transform="translate(0 -7) rotate(-4 1254 357)" filter="url(#car-shadow)">
    <g fill="none" stroke="#70B8AD" stroke-linecap="round" stroke-width="6">
      <path d="M1014 350h-38"/><path d="M1009 370h-57"/><path d="M1016 390h-29"/>
    </g>
    <!-- main silhouette -->
    <path d="M1050 339h24l37-79c9-19 28-29 50-29h140c21 0 40 10 51 25l50 83h16c22 0 40 17 40 39v38c0 15-11 26-26 26h-358c-31 0-51-18-51-47v-18c0-22 12-38 27-38Z" fill="#F5795B" stroke="#2C4151" stroke-width="7" stroke-linejoin="round"/>
    <!-- single large app window with browser chrome -->
    <path d="M1160 251h137c13 0 24 6 32 18l43 62h-255l31-67c3-8 7-13 12-13Z" fill="#E2F8F2" stroke="#2C4151" stroke-width="6" stroke-linejoin="round"/>
    <path d="M1127 278h221" fill="none" stroke="#2C4151" stroke-width="5"/>
    <circle cx="1164" cy="264" r="5.4" fill="#EC806E"/>
    <circle cx="1182" cy="264" r="5.4" fill="#F2C75F"/>
    <circle cx="1200" cy="264" r="5.4" fill="#6CC8AA"/>
    <!-- a simple expressive face that remains recognizable at reduced sizes -->
    <circle cx="1215" cy="308" r="6" fill="#304655"/>
    <path d="M1281 308q8-9 16 0" fill="none" stroke="#304655" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M1241 316q13 14 27 0" fill="none" stroke="#304655" stroke-width="4" stroke-linecap="round"/>
    <!-- body details kept intentionally sparse -->
    <path d="M1309 341v82" stroke="#D76249" stroke-width="4"/>
    <rect x="1332" y="360" width="28" height="7" rx="3.5" fill="#FBD794" stroke="#304655" stroke-width="2.5"/>
    <rect x="1423" y="364" width="28" height="27" rx="10" fill="#FFE2A1" stroke="#304655" stroke-width="4"/>
    <path d="M1395 404q10 8 21-1" fill="none" stroke="#AA4A37" stroke-width="3.5" stroke-linecap="round"/>
    <!-- clear thick wheels -->
    <g>
      <circle cx="1114" cy="435" r="42" fill="#273948"/>
      <circle cx="1114" cy="435" r="21" fill="#E6EFF0"/>
      <circle cx="1114" cy="435" r="6" fill="#8CA4AE"/>
      <circle cx="1380" cy="435" r="42" fill="#273948"/>
      <circle cx="1380" cy="435" r="21" fill="#E6EFF0"/>
      <circle cx="1380" cy="435" r="6" fill="#8CA4AE"/>
    </g>
  </g>
</g>
</svg>
